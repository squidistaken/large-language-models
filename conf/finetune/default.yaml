# Settings for action=finetune
# Each run saves a copy of the values

# what to train on
condition: en              # en = English, hr = Croatian, both = both (bilingual)
data_dir: ${prepare.out_dir}
target_lang: ${prepare.target_lang}

# Which model
model_name: ???
model_revision: main
chat_template_kwargs: {}

# LoRA add on
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

# Precision
quantization: none  # none = LoRA, 4bit = QLoRA 

# Training
learning_rate: 2.0e-4
epochs: 3
batch_size: 8
grad_accum_steps: 2
max_length: 256       # max tokens per example
warmup_ratio: 0.03


# choosing best checkpoint
checkpoint_metric: eval_loss 

#Output
seed: ${seed}
out_dir: outputs/finetune 

# Run name, logging and quick-test limits
run_name: ${now:%Y%m%d_%H%M%S}       # results go to outputs/finetune/<condition>/<run_name>
report_to: none                      # To do
max_train_samples: null
max_eval_samples: null


# Scoring a trained run
score: 
  run_dir: ???
  split: dev
  batch_size: 16
  max_new_tokens: 48
  max_samples: null
  