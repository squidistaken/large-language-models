condition: en # en = English only, hr (the target_lang) = Croatian only, bilingual = both
data_dir: ${prepare.out_dir}
target_lang: ${prepare.target_lang}

# LoRA adapter (QLoRA when model.quantization=4bit)
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

# Training
learning_rate: 2.0e-4
epochs: 3
batch_size: 8
grad_accum_steps: 2
max_length: 256 # max tokens per example
warmup_ratio: 0.03
logging_steps: 10 # optimizer steps between training-loss logs

# Dev evaluation: the loss, plus the metrics of generated answers on a fixed dev subset
evals_per_epoch: 2 # dev evaluations, and checkpoints, per epoch
metric_samples: null # dev lines per language scored at every evaluation; null = all, 0 = off
checkpoint_metric: micro_f1 # what picks the kept checkpoint and drives early stopping: loss | micro_f1
early_stopping_patience: 2 # stop after this many evaluations without improvement; null = off
gradient_checkpointing: true # recompute activations in the backward pass to save memory
full_determinism: true # identical GPU runs for the same seed; false can be faster on large models

# Output
seed: ${seed}
out_dir: ${out_dir}/finetune
run_name: ${now:%Y%m%d_%H%M%S}
max_train_samples: null
max_eval_samples: null
overwrite: false # true = replace an existing run folder

# Scoring a trained run; runs automatically on dev after fine-tuning.
score:
  run_dir: null # null = the latest finished run
  split: dev
  max_samples: null

# Choosing the final configuration; runs automatically after every full dev scoring.
select:
  candidates: null # null = every run scored on the full dev set in all conditions
  metric: micro_f1
