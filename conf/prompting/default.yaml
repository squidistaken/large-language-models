data_dir: ${prepare.out_dir}
target_lang: ${prepare.target_lang}
out_dir: ${out_dir}/prompting
split: dev
max_samples: null   # null = every line; an integer scores a seeded random subset per language
shots: 0
template: default  # one of `templates` below; variants are scored on dev only
demonstration_selection: coverage  # how chosen demonstrations are picked: coverage (greedy emotion cover) | random; random is scored on dev only
demonstration_ids: null  # null = chosen from the pair's train split at run time; a list of `shots` alignment ids pins them
summary_models: null  # the models summarise_prompting includes; null = every model with prompting runs
seed: ${seed}

# The prompt wording.
# - `default` is the instruction the splits are prepared and the PEFT runs trained with.
# - Every template must define the eight labels through {definitions}, allow several labels, and ask
#   for a JSON list of the English label names only.

# This is the fixed label order, do not change it.
definitions:
  anger: displeasure or hostility at a perceived wrong
  anticipation: expecting or looking forward to something
  disgust: revulsion or strong disapproval
  fear: feeling threatened or afraid
  joy: happiness or pleasure
  sadness: sorrow, loss or disappointment
  surprise: reaction to something unexpected
  trust: confidence in, or acceptance of, someone or something

# The system message; {definitions} becomes the label list.
templates:
  default: |-
    You classify the emotions expressed in a movie subtitle line.

    Permitted labels:
    {definitions}

    Every line expresses at least one of these emotions and may express several. Answer with a JSON list of the matching label names, using only the names above, and nothing else, in the format ["label", ...].
  terse: |-
    Label the emotions in this subtitle line. Choose one or more of:
    {definitions}

    Reply with only a JSON list of the chosen label names, like ["label", ...].
  annotator: |-
    You are an expert annotator of emotions in film dialogue, using Plutchik's eight basic emotions:
    {definitions}

    Read the subtitle line and decide which of these emotions it expresses; a line can express one emotion or several at once. Respond with a JSON list of the label names exactly as written above, and no other text.

# The user message; {text} becomes the subtitle line.
user: "Subtitle: {text}"
