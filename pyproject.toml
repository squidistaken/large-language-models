[project]
name = "large-language-models"
version = "0.1.0"
description = "Repository for the Large Language Models course (WBAI068-05) at the University of Groningen."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "certifi>=2026.7.22",
    "datasets>=5.0.1",
    "hydra-core>=1.3.7",
    "iterative-stratification>=0.1.9",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "omegaconf>=2.3.1",
    "peft>=0.21.1",
    "pre-commit>=4.6.2",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "ruff>=0.16.6",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
    "ty>=0.0.80",
    "wandb>=0.30.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["report"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "NPY", # numpy-specific rules
    "PD",  # pandas-vet
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line length handled by ruff format
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]    # imports not at top of notebook cells
"main.py" = ["E402"]        # environment set before torch is imported

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.13"
root = ["."]

[tool.ty.src]
exclude = ["report"]
